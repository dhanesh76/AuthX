# ==========================================
# NGINX MASTER PROCESS CONFIGURATION
# ==========================================

# Automatically create optimal worker processes
# based on available CPU cores
worker_processes auto;


# ==========================================
# CONNECTION HANDLING
# ==========================================

events {

    # Maximum simultaneous connections
    # each worker process can handle
    worker_connections 1024;

}


# ==========================================
# HTTP CONFIGURATION
# ==========================================

http {

    # --------------------------------------
    # BACKEND UPSTREAM GROUP
    # --------------------------------------
    #
    # "app" is the Docker Compose service name.
    #
    # When scaled:
    # docker compose up --scale app=3
    #
    # Docker DNS resolves:
    # app -> multiple container IPs
    #
    # nginx distributes requests across them
    # using default ROUND ROBIN balancing.
    #
    # --------------------------------------

    upstream backend {

        server app:8080;

    }


    # ======================================
    # MAIN PUBLIC SERVER
    # ======================================

    server {

        # Public HTTP port exposed by nginx
        listen 80;

        # Catch-all domain/server name
        server_name _;


        # ==================================
        # REVERSE PROXY ROUTING
        # ==================================

        location / {

            # Forward request to upstream group
            proxy_pass http://backend;


            # ==============================
            # CLIENT METADATA FORWARDING
            # ==============================

            # Original requested host/domain
            proxy_set_header Host $host;

            # Real client IP address
            proxy_set_header X-Real-IP $remote_addr;

            # Full proxy chain tracking
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Original protocol (http/https)
            proxy_set_header X-Forwarded-Proto $scheme;


            # ==============================
            # CONNECTION SETTINGS
            # ==============================

            # Use HTTP/1.1 between nginx and backend
            proxy_http_version 1.1;

            # Enable keepalive behavior
            proxy_set_header Connection "";

        }


        # ==================================
        # OPTIONAL HEALTH CHECK ENDPOINT
        # ==================================
        #
        # Allows easy nginx verification
        #
        # curl localhost/nginx-health
        #
        # ==================================

        location /nginx-health {

            access_log off;

            return 200 "nginx healthy";

        }
    }
}