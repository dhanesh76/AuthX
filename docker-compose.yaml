#docker creates a default network of the nanme
#<folder_name>_default
networks:
  backend:
    name: my-net

#docker creates the named volume in the host machine
#at /var/lib/docker/volume_name/data
volumes:
  redis:
  postgres:

#compose is service oriented, not container oriented
#hence the service name is registered in the network dns
#not the container name
services:
  postgres:
    image: postgres:17

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    volumes:
      - postgres:/var/lib/postgresql/data

    restart: unless-stopped

  redis:
    image: redis:7

    command: redis-server --requirepass ${REDIS_PASSWORD}

    volumes:
      - redis:/data

    restart: unless-stopped

  app:
    build: .

    expose:
      - "8080"

    env_file:
      - .env

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      REDIS_HOST: redis
      REDIS_PORT: 6379

    depends_on:
      - postgres
      - redis

    restart: unless-stopped

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - app
    restart: unless-stopped

# restart policies: no, always, on-failure, unless-stopped